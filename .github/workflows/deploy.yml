# Deploy production from main. Pull requests run the browser/game regression suites first.
name: Build, test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - name: Fetch pinned CC0 game assets
        run: npm run fetch-assets
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_TURN_URL: ${{ vars.VITE_TURN_URL }}
          VITE_TURN_USER: ${{ secrets.VITE_TURN_USER }}
          VITE_TURN_PASS: ${{ secrets.VITE_TURN_PASS }}
      - run: npm test

      - name: Install Chromium for PR smoke tests
        if: github.event_name == 'pull_request'
        run: npx playwright install --with-deps chromium
      - name: Core 3-client multiplayer / gameplay smoke
        if: github.event_name == 'pull_request'
        run: npm run smoke
        env:
          SMOKE_LOCAL_PEER: '1'
      - name: 15-player lobby capacity smoke
        if: github.event_name == 'pull_request'
        run: npm run smoke:lobby15
        env:
          SMOKE_LOCAL_PEER: '1'
      - name: iPad-style touch movement / jump / USE smoke
        if: github.event_name == 'pull_request'
        run: npm run smoke:touch
        env:
          SMOKE_LOCAL_PEER: '1'

      # Production Pages artifacts are created only from non-PR runs (normally main).
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
