name: Build, test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_TURN_URL: ${{ vars.VITE_TURN_URL }}
          VITE_TURN_USER: ${{ secrets.VITE_TURN_USER }}
          VITE_TURN_PASS: ${{ secrets.VITE_TURN_PASS }}
      - run: npm test
      - name: Install Chromium for the smoke test
        run: npx playwright install --with-deps chromium
      - name: Smoke test (local peerjs signaling server)
        run: npm run smoke
        env:
          SMOKE_LOCAL_PEER: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
