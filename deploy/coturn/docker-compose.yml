services:
  coturn:
    image: coturn/coturn:4.6.3-r1
    restart: unless-stopped
    network_mode: host
    env_file: .env
    command:
      - -n
      - --log-file=stdout
      - --fingerprint
      - --lt-cred-mech
      - --realm=${TURN_REALM}
      - --user=${TURN_USER}:${TURN_PASS}
      - --listening-port=3478
      - --tls-listening-port=5349
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-multicast-peers
      - --stale-nonce=600
      - --external-ip=${TURN_PUBLIC_IP}
